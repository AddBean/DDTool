name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: DDTool-windows
            asset: dist/DDTool-Windows-x64.exe
          - os: macos-14
            artifact: DDTool-macos-arm64
            asset: dist/DDTool-macOS-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Build macOS
        if: runner.os == 'macOS'
        run: zsh ./scripts/build-macos.sh
      - name: Prepare Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -LiteralPath 'dist\豆荚工具.exe' -Destination 'dist\DDTool-Windows-x64.exe'
      - name: Prepare macOS release asset
        if: runner.os == 'macOS'
        run: cp 'dist/豆荚工具.dmg' 'dist/DDTool-macOS-arm64.dmg'
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: |
          find release-assets -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* SHA256SUMS.txt --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
