name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      PYTHONPATH: src
      PIP_INDEX_URL: https://pypi.org/simple
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: DDTool-windows
            asset: dist/DDTool-Windows-x64*
          - os: macos-15
            artifact: DDTool-macos-arm64
            asset: dist/DDTool-macOS-arm64.*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m ddtool --ui-smoke-test
      - name: Stamp packaged version
        shell: bash
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          echo "DDTOOL_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Build macOS
        if: runner.os == 'macOS'
        run: zsh ./scripts/build-macos.sh
      - name: Smoke-test the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DDTOOL_UI_SMOKE_RESULT = Join-Path $env:RUNNER_TEMP 'ddtool-ui-smoke.txt'
          $exe = Start-Process -FilePath 'dist\DDTool\DDTool.exe' -ArgumentList '--ui-smoke-test' -PassThru -Wait
          if (!(Test-Path $env:DDTOOL_UI_SMOKE_RESULT)) { throw 'No packaged UI smoke result' }
          $result = Get-Content -Raw $env:DDTOOL_UI_SMOKE_RESULT
          if ($exe.ExitCode -ne 0 -or $result.Trim() -ne 'OK') { throw "Packaged UI smoke failed: $result" }
          python scripts/check-package-launch.py 'dist\DDTool\DDTool.exe'
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$compiler) { $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          & $compiler "/DAppVersion=$env:DDTOOL_VERSION" 'scripts\DDTool.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $target = Join-Path $env:RUNNER_TEMP 'DDTool installed 测试'
          $setup = Start-Process -FilePath 'dist\DDTool-Windows-x64-Setup.exe' -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          python scripts/check-package-launch.py (Join-Path $target 'DDTool.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed application failed to launch' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path (Join-Path $target 'DDTool.exe'))) { throw 'Uninstall failed' }
      - name: Smoke-test the macOS package
        if: runner.os == 'macOS'
        run: |
          export DDTOOL_UI_SMOKE_RESULT="$RUNNER_TEMP/ddtool-ui-smoke.txt"
          'dist/豆荚工具.app/Contents/MacOS/DDTool' --ui-smoke-test
          test "$(cat "$DDTOOL_UI_SMOKE_RESULT")" = 'OK'
          python scripts/check-package-launch.py 'dist/豆荚工具.app/Contents/MacOS/DDTool'
      - name: Prepare macOS release asset
        if: runner.os == 'macOS'
        run: |
          cp 'dist/豆荚工具.dmg' 'dist/DDTool-macOS-arm64.dmg'
          pkgbuild --component 'dist/豆荚工具.app' --install-location /Applications --identifier com.ddtool.app.installer --version "$DDTOOL_VERSION" 'dist/DDTool-macOS-arm64.pkg'
          pkgutil --payload-files 'dist/DDTool-macOS-arm64.pkg' > "$RUNNER_TEMP/ddtool-payload.txt"
          grep -q 'Contents/MacOS/DDTool' "$RUNNER_TEMP/ddtool-payload.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: |
          find release-assets -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* SHA256SUMS.txt --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
